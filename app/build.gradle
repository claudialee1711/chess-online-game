// Native Google Sign-In dependencies require AndroidX.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chessarena171.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chessarena171.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}