// Native Google Sign-In dependencies require AndroidX.
plugins {
    id 'com.android.application'
}

def stableKeystoreFile = file("chess-arena-signing.jks")
def hasStableSigningKey = stableKeystoreFile.exists()

android {
    namespace 'com.chessarena171.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chessarena171.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    if (hasStableSigningKey) {
        signingConfigs {
            stable {
                storeFile stableKeystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Keep the normal debug certificate until the repository secrets are configured.
            if (hasStableSigningKey) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
